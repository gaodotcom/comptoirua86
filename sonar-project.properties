# Configuration du scanner SonarQube pour "Le Comptoir des adhérents"
# Lancer avec :
#   docker run --rm --network=adherents_default \
#     -v "$(pwd):/usr/src" sonarsource/sonar-scanner-cli

sonar.projectKey=adherents
sonar.projectName=Le Comptoir des adherents
sonar.projectVersion=1.0

# URL du serveur SonarQube (nom du service dans le réseau Docker)
sonar.host.url=http://sonarqube:9000

# Sources : PHP (app + controllers + index) et templates Twig
sonar.sources=app,controllers,index.php,templates
sonar.exclusions=vendor/**,public/uploads/**,node_modules/**,docker/**

# Langages analysés
sonar.php.file.suffixes=php
sonar.twig.file.suffixes=twig

# Encodage
sonar.sourceEncoding=UTF-8

# Branche courante
sonar.scm.disabled=true
