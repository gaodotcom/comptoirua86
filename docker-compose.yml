services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command:
      - /bin/sh
      - -lc
      - |
        mkdir -p /var/www/html/public/uploads/members /var/www/html/public/uploads/trainings
        chmod -R 0777 /var/www/html/public/uploads
        exec apache2-foreground
    ports:
      - "8080:80"
    env_file: .env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-adherents}
      MARIADB_USER: ${DB_USER:-adherents}
      MARIADB_PASSWORD: ${DB_PASSWORD:-adherents}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "8025:1025" # SMTP
      - "8082:8025" # Web UI

  # --- SonarQube (audit qualité / sécurité du code) ---
  sonar-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:lts-community
    restart: unless-stopped
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_ext:/opt/sonarqube/extensions

volumes:
  db_data:
  sonar_db_data:
  sonar_data:
  sonar_logs:
  sonar_ext:
